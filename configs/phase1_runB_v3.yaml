# v3 = v2 + train.epochs 50 (原 30)。唯一改动, 学习率计划不变, 使 v2 vs v3 为单变量对比。
# 依据: 30 轮时验证曲线斜率已衰减 7-23 倍但仍为正 (+0.0005 至 +0.0017/轮), patience 6
#   几乎从未触发, 说明 30 是硬截断而非收敛。更关键的是欠训练不对称 —— 空间分块的残余
#   斜率约为随机划分的两倍, 而『分块 M1 仅低 0.007』正是头条结论, 两条线必须在同等
#   充分的训练下比较。Gauch 官方用 50 轮。
# 保持 1:5e-4,12:1e-4,22:5e-5 意味着第 22 轮后一直是 5e-5, 那正是训到收敛该有的长尾。
data:
  root: /ibex/project/c2266/abbaa0a/data/input_data/hourly_q_dl/6datasets_H_8760_512_temporal_local_19800101_20251231_0.7_0.3_False_ts_func2_1000_5.0_False_10000_s_func2_1095_10000_3_42_penman_MSWEP_V316_test_Past_hourly_10_hourly_9181_42
  index_dir: index
  source: hourly_cache
  cache_dir: /ibex/user/kongw0a/hourly_cache
  stride: 24
  lookback_daily: 365
  chunk_size: 512
  lookback_hourly: 336
  include_corrected: true
  static_exclude:
  - pedigree_of_HDI_2015
  - pedigree_of_GDP_per_capita_2015
  - GDP_5arcmin_2015
  - GDP_30arcsec_2015
  - HDI_2015
  - GDP_percapita_2015
  - gpw_v4_rev11_2000
  - gpw_v4_rev11_2005
  - gpw_v4_rev11_2010
  - gpw_v4_rev11_2015
  - gpw_v4_rev11_2020
  - globpop_density_30arc_2022
  - globpop_density_30arc_2020
  - globpop_density_30arc_2010
  - globpop_density_30arc_2000
  - globpop_density_30arc_1990
  - elevation_SRTM_v2.1_GTOPO30
  onehot_static: {}
folds:
  file: folds/folds_random.csv
  n_folds: 5
  seed: 42
model:
  hidden_size_daily: 128
  hidden_size_hourly: 128
  num_layers: 1
  dropout: 0.4
  head_dropout: true
  initial_forget_bias: 3
  frequency_factor: 24
  reg_window: 24
train:
  epochs: 50
  batches_per_epoch: 20000
  val_max_stations: 0
  val_batches_per_station: 1
  lr: 0.0005
  lr_schedule: 1:5e-4,12:1e-4,22:5e-5
  loss: nse_basin
  reg_lambda: 1.0
  early_stopping: true
  patience: 6
  num_workers: 6
  pin_memory: true
  seed: 42
  grad_clip: 1.0
transfer:
  epochs: 12
  batches_per_epoch: 4000
  lr: 0.0005
  weight_decay: 1.0e-05
  agg_loss_weight: 0.5
  freeze_modules:
  - lstm_hourly
  min_daily_hours: 18
  holdout_batches_per_station: 2
  patience: 4
  num_workers: 6
  seed: 42
  grad_clip: 1.0
eval:
  max_batches_per_station: 12
  min_samples_per_station: 100
wandb:
  project: global_mtslstm_phase1
  entity: null
  mode: online
  group: null
output_root: outputs/v3_runB

# v2 = 冻结配置 + 搜索结论。相对 configs/phase1.yaml:
#   lookback_hourly 168 (原 72) —— fold 1 搜索里唯一超出折间噪声的发现,
#     H=168/336 的 M1 比 H=72 高约 0.05 (折间 sigma 0.017), 且源域遗忘同时减轻。
#   initial_forget_bias 3 —— Gauch 已发表方法的组成部分。两组严格配对的性能效应
#     符号相反 (+0.009 / -0.027, 均值 0.5 sigma), 无法判定, 故按方法忠实性采纳。
data:
  root: /ibex/project/c2266/abbaa0a/data/input_data/hourly_q_dl/6datasets_H_8760_512_temporal_local_19800101_20251231_0.7_0.3_False_ts_func2_1000_5.0_False_10000_s_func2_1095_10000_3_42_penman_MSWEP_V316_test_Past_hourly_10_hourly_9181_42
  index_dir: index
  lookback_hourly: 168
  include_corrected: true
  static_exclude:
  - pedigree_of_HDI_2015
  - pedigree_of_GDP_per_capita_2015
  - GDP_5arcmin_2015
  - GDP_30arcsec_2015
  - HDI_2015
  - GDP_percapita_2015
  - gpw_v4_rev11_2000
  - gpw_v4_rev11_2005
  - gpw_v4_rev11_2010
  - gpw_v4_rev11_2015
  - gpw_v4_rev11_2020
  - globpop_density_30arc_2022
  - globpop_density_30arc_2020
  - globpop_density_30arc_2010
  - globpop_density_30arc_2000
  - globpop_density_30arc_1990
  - elevation_SRTM_v2.1_GTOPO30
  onehot_static: {}
folds:
  file: folds/folds_random.csv
  n_folds: 5
  seed: 42
model:
  hidden_size_daily: 128
  hidden_size_hourly: 128
  num_layers: 1
  dropout: 0.4
  head_dropout: true
  initial_forget_bias: 3
  frequency_factor: 1
  reg_window: 24
train:
  epochs: 30
  batches_per_epoch: 20000
  val_max_stations: 0
  val_batches_per_station: 1
  lr: 0.0005
  lr_schedule: 1:5e-4,12:1e-4,22:5e-5
  loss: nse_basin
  reg_lambda: 1.0
  early_stopping: true
  patience: 6
  num_workers: 6
  pin_memory: true
  seed: 42
  grad_clip: 1.0
transfer:
  epochs: 12
  batches_per_epoch: 4000
  lr: 0.0005
  weight_decay: 1.0e-05
  agg_loss_weight: 0.5
  freeze_modules:
  - lstm_hourly
  min_daily_hours: 18
  holdout_batches_per_station: 2
  patience: 4
  num_workers: 6
  seed: 42
  grad_clip: 1.0
eval:
  max_batches_per_station: 12
  min_samples_per_station: 100
wandb:
  project: global_mtslstm_phase1
  entity: null
  mode: online
  group: null
output_root: outputs/v2_runA

# v3 = v2 with train.epochs 50 (was 30) and train.patience 10 (was 6).
#
# Why: at epoch 30 the validation slope had decayed 7-23x but was still positive
# (+0.0005 to +0.0017 per epoch) and patience 6 almost never fired, so 30 was a hard
# cut-off rather than convergence. More importantly the under-training was asymmetric --
# the spatially blocked split's residual slope was about twice the random split's, and
# "blocked M1 is only 0.007 lower" is the headline claim, so both must be compared under
# equally sufficient training. Gauch et al. use 50 epochs.
#
# patience also rises to 10. Raising the epoch cap alone cannot answer the convergence
# question: with patience still 6 and per-fold counters already at 2-6, folds terminate
# on noise rather than on the cap (the per-epoch trend is about an eighth of the
# oscillation). Relaxing patience makes the cap the binding constraint. The cost is that
# v3 changes two settings and is therefore NOT a single-variable comparison against v2 --
# it is reported as a convergence check and stays out of the main table.
#
# lr_schedule is unchanged. Keeping 1:5e-4,12:1e-4,22:5e-5 means 5e-5 from epoch 22
# onward, which is the long tail training to convergence should have.
